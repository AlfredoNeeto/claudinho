; Claudinho - um projeto, uma env por placa (door 5 do plano).
; Testes do núcleo rodam na placa plugada: pio test -e cyd -f test_<nome>

[platformio]
default_envs = cyd
; caminho curto: o pacote do framework passa dos 260 caracteres do Windows dentro de C:\Users\<nome>\.platformio
core_dir = C:/pio

[env]
; Arduino core 3.3.12 fixado (o "stable" do pioarduino já é o core 4.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
test_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.0

[env:cyd]
board = esp32dev
; LVGL + fontes não cabem nos 1,2 MB da partição padrão; sem OTA, então app grande
board_build.partitions = huge_app.csv
; o reset automático desta CYD não entra no modo de gravação: antes de gravar, segure BOOT, toque RST, solte BOOT.
; O esptool não reseta antes (senão sai do modo de gravação) e reseta depois pelo RTS, que funciona.
board_upload.before_reset = no-reset
build_flags =
  -D CLAUDINHO_BOARD=\"cyd\"
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
lib_deps =
  ${env.lib_deps}
  moononournation/GFX Library for Arduino@^1.6.4
  lvgl/lvgl@^9.2.2
